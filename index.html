<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="todolist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4dd.png" type="image/png">
    

<body>
    <title>To-Do List</title>
    <div class="container">
        <h1>To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button id="addTaskBtn"><i class="fas fa-plus"></i></button>
        <ul id="taskList"></ul>
        <button id="clearTasksBtn"><i class="fas fa-trash"></i> Clear All Tasks</button>
    </div>
    <script src="todolist.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#addTaskBtn').click(function() {
                const taskText = $('#taskInput').val().trim();
                if (taskText) {
                    $('#taskList').append(`<li>${taskText} <button class="deleteBtn"><i class="fas fa-trash"></i></button></li>`);
                    $('#taskInput').val('');
                }
            });

            $('#taskList').on('click', '.deleteBtn', function() {
                $(this).parent().remove();
            });

            $('#clearTasksBtn').click(function() {
                $('#taskList').empty();
            });
        });
    </script>
</div>

</body>
</html>
